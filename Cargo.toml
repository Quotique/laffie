[workspace]
resolver = "2"

members = [
    "src/database",
    "src/solver",
    "src/parser",
    "src/view",
    "src/utils",

    "src/bin/cli",
    "src/bin/tgbot",
    "src/bin/migrate_db",
    "src/bin/tui"
]

[workspace.package]
version = "0.4.2"
authors = ["Alexander A"]
edition = "2021"

[workspace.dependencies]
chrono = "0.4"
eyre = "0.6"
itertools = "0.14"
log = "0.4"
serde = "1.0"
serde_derive = "1.0"
smartstring = "1"
trees = { git = "https://github.com/Quotique/trees.git" }

