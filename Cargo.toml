[workspace]
resolver = "2"

members = [
    "src/database",
    "src/solver",
    "src/parser",
    "src/view",
    "src/utils",

    "src/bin/cli",
    "src/bin/tgbot",
    "src/bin/migrate_db",
    "src/bin/tui"
]

[workspace.package]
version = "0.5.0"
authors = ["Alexander A"]
edition = "2024"

[workspace.dependencies]
chrono = "0.4"
eyre = "0.6"
itertools = "0.14"
log = { version = "0.4", features = ["kv"] }
parking_lot = "0.12"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
smartstring = { version = "1", features = ["serde"] }
trees = { git = "https://github.com/Quotique/trees.git", branch = "serde", features = ["serde"] }

