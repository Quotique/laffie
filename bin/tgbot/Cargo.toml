[package]
name = "tgbot"
version = "0.2.2"
edition = "2018"

[dependencies]
database = { path = "../../database" }
mcore = { path = "../../mcore/" }
parser = { path = "../../parser" }
view = { path = "../../view" }

chrono = "0.4"
config = "0.9"
clap = "3.1"
cpu-freq = "0.0.2"
futures = "0.3"
lazy_static = "1.4"
rust-i18n = "0.5"
serde_derive = "1.0"
serde = "1.0"
strip-ansi-escapes = "0.1"
sys-info = "0.9"
tokio = { version = "1.17", features = ["macros", "time", "fs", "rt-multi-thread"] }
telegram-bot = { git ="https://github.com/Quotique/telegram-bot", default-features = false, features = ["rustls"]}
