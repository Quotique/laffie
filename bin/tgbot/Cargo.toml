[package]
name = "tgbot"
version = "0.2.2"
edition = "2021"

[dependencies]
database = { path = "../../database" }
mcore = { path = "../../mcore/" }
parser = { path = "../../parser" }
view = { path = "../../view" }

chrono = "0.4"
clap = "4.5"
config = "0.14"
cpu-freq = "0.0.2"
futures = "0.3"
rust-i18n = "3.0"
serde = "1.0"
serde_derive = "1.0"
strip-ansi-escapes = "0.2"
sys-info = "0.9"
telegram-bot = { git ="https://github.com/Quotique/telegram-bot", default-features = false, features = ["rustls"]}
tokio = { version = "1.17", features = ["macros", "time", "fs", "rt-multi-thread"] }
