# Canonical cli config. Pick a task set with -p/--tasks, e.g.
#   cli -c config/cli.yaml -p tasks/regress   (the regression gate)
#   cli -c config/cli.yaml -p tasks/slow
#   cli -c config/cli.yaml -p tasks/unsolved
# For verbose tracing use config/cli_trace.yaml.
logger:
  filename: "logs/cli.log"
  level: "Info"
  num_files: 3
  file_rotate_bytes: 1000000000
  target_levels:
    solver: "Info"
    redb: "Warn"

symbols_dir: "symbols"
tasks_dir: "tasks/test"
