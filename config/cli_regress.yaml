# Регресс-гейт: задачи, которые решаются надёжно.
# Полный гейт = этот конфиг + config/cli.yaml (tasks/test, интеграция).
logger:
  filename: "logs/cli.log"
  level: "Info"
  num_files: 3
  file_rotate_bytes: 1000000000
  target_levels:
    solver: "Info"
    redb: "Warn"

symbols_dir: "symbols"
tasks_dir: "tasks/regress"
