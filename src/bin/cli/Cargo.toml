[package]
name = "cli"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "cli"
path = "./main.rs"

[dependencies]
solver = { path = "../../solver" }
parser = { path = "../../parser" }
view = { path = "../../view" }
database = { path = "../../database" }
utils = { path = "../../utils" }

serde = { workspace = true }
serde_derive = { workspace = true }

clap = { version = "4.5", features = ["derive"] }
colored = "3"
config = "0.15"
