[package]
name = "cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cli"
path = "./main.rs"

[dependencies]
mcore = { path = "../../mcore/" }
parser = { path = "../../parser" }
view = { path = "../../view" }
database = { path = "../../database" }
utils = { path = "../../utils" }

serde = { workspace = true }
serde_derive = { workspace = true }

clap = { version = "4.5", features = ["derive"] }
colored = "2"
config = "0.14"
