[package]
name = "cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "cli"
path = "./main.rs"

[dependencies]
mcore = { path = "../../mcore/" }
parser = { path = "../../parser" }
view = { path = "../../view" }
database = { path = "../../database" }

clap = { version = "4.5", features = ["derive"] }
colored = "2"
config = "0.14"
serde = "1.0"
serde_derive = "1.0"
