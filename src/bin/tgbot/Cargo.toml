[package]
name = "tgbot"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "tgbot"
path = "./main.rs"

[dependencies]
database = { path = "../../database" }
mcore = { path = "../../mcore/" }
parser = { path = "../../parser" }
view = { path = "../../view" }
utils = { path = "../../utils" }

chrono = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }

clap = "4.5"
config = "0.15"
cpu-freq = "0.0.2"
futures = "0.3"
rust-i18n = "3.0"
strip-ansi-escapes = "0.2"
sys-info = "0.9"
telegram-bot = { git ="https://github.com/Quotique/telegram-bot", default-features = false, features = ["rustls"]}
tokio = { version = "1.17", features = ["macros", "time", "fs", "rt-multi-thread"] }
