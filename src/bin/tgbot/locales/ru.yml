ru:
  buttons:
    help: "Список команд"
    tasks: "Мои задачи"
    guide: "Руководство"
    examples: "Примеры задач"
    rerun: "Повторить решение"
    report: "Сообщить об ошибке"
  content:
    empty_tasks_list: "Нет задач"
    reported: "Сообщение отправлено"
    start: |
      Laffie - пользовательский интерфейс к ядру символьной арифметики Minerva.

      <u><b>Внимание:</b></u> бот находится в тестовом режиме.
      Работоспособность не гарантируется.

      %{version}

      %{system}
    help: |
      Список доступных команд:
      /start - запуск бота, информация о текущей версии.
      /task { ... } - создать новую задачу.
      /tasks_list - список ранее введенных задач.

      /help - список доступных команд.
      /guide - руководство по вводу задач.
      /examples - примеры задач.
    instruction: |
      Как вводить задачи:

      Новая задача вводится с помощью команды <i>/task</i>, далее в фигурных скобках вводится данные задачи.
      <i>goal</i> обозначает целевую установку задачи.
      На данный момент существуют три возможные целевые установки:
      1. <i>find(x)</i> выражение значения переменной <i>x</i> через известные параметры.
      2. <i>proof(&lt;statement&gt)</i> доказать истинность утвержение (вывести его из условий задачи).
      3. <i>transform(&lt;statement&gt)</i> преобразовать (упростить) выражение.

      Целевая установка задачи обязательно должна присутствовать и должна быть единственной.
      Все прочие утвержения считаются условиями задачи.
      Список условий не может быть пустым, но может содержать бессмысленные условия, состоящий из констант.
      Все утверждения, включая целевую установку, заканчиваются символом <i>;</i>

      В утвержениях допускаются следующие символы:
      <i> &lt, &gt, &lt=, &gt=, ==, != </i> - симолы сравнения.
      <i> ||, && </i> - логические операции.
      <i> +, -, /, *, ^ </i> - арифметические операции.
      <i> sqrt(x) </i> - квадратный корень.
      <i> set(x, y, z), empty_set </i> - множества.
    examples: |
      Примеры задач.

      Простейшее линейное уравнение:
      <code>/task {
          goal find(x);

          2*x-5 == 0;
      }</code>

      <code>/task {
          goal find(x);

          2*(x+4) + 3*(x-5) == 0;
      }</code>

      Линейное уравнение с параметром:
      <code>/task {
          goal find(x);

          2*x-5+t == 0;
          t is known;
      }</code>

      Преобразование логических выражений:
      <code>/task {
          goal find(x);

          (x^4 - 25*x^2 + 60*x -36 != 0) && ((3600 &lt 0 && x in empty_set) || (3600 &gt= 0 && x in set(1, 4)));
      }</code>

      Квадратное уравнение:
      <code>/task {
          goal find(x);

          3*x^2+2*x-5 == 0;
      }</code>

      Дробно-рациональное уравнение:
      <code>/task {
          goal find(x);

          1/(x-1) + 2/(x-2) + 3/(x-3) == 6/(x+6);
      }</code>

      Пример задачи на доказательство:
      <code>/task {
          goal proof(x &gt 0);

          x == 2;
      }</code>

      Пример задачи с бессмысленным набором условий:
      <code>/task {
          goal proof(1 &gt 0);

          x == 2;
      }</code>

  errors:
    unknown_command: "Недопустимая команда"
    task_not_found: "Задача не найдена"

